[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-leaf-severity-tracker"
version = "0.1.0"
description = "Apple leaf and lesion segmentation, visible-area severity and longitudinal observations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<14", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "torch>=2.2,<3", "torchvision>=0.17,<1", "matplotlib>=3.7,<4"]

[project.scripts]
leaf-severity = "leafseverity.cli:main"

[tool.setuptools.packages.find]
include = ["leafseverity*"]
